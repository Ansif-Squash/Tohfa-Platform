android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
hermesEnabled=true
newArchEnabled=false
org.gradle.vfs.watch=false

# PLACEHOLDER — @rnmapbox/maps' Mapbox maven repo (see android/build.gradle's
# allprojects.repositories block). Only needed if a future Mapbox SDK version
# reinstates its download-token requirement; harmless as an empty/placeholder
# value until then. Replace with a real Mapbox secret token (downloads:read
# scope) from https://account.mapbox.com/access-tokens/, or set the
# RNMAPBOX_MAPS_DOWNLOAD_TOKEN environment variable instead of editing this
# file (preferred, so the token never lands in version control).
MAPBOX_DOWNLOADS_TOKEN=YOUR_MAPBOX_DOWNLOADS_TOKEN
